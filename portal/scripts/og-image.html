<!doctype html>
<!-- 공유 미리보기 이미지 원본. 수정 후 npm run og:portal 로 portal/public/og.png를 다시 만드세요.
     자주 바뀌는 날짜·장소는 넣지 않습니다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f7f6f2; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #1c2420; word-break: keep-all; }
  .card { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 700; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #2446c7; color: #fff; display: grid; place-items: center; font: 700 26px Arial, sans-serif; }
  h1 { margin: 0; font-size: 62px; line-height: 1.22; letter-spacing: -2px; }
  h1 em { font-style: normal; color: #2446c7; }
  .steps { display: flex; gap: 14px; font-size: 26px; font-weight: 700; }
  .steps span { padding: 10px 22px; border-radius: 999px; background: #fff; border: 2px solid #dddbd2; }
  .steps span.studio { background: #e7ebfa; border-color: #cdd6f6; color: #2446c7; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><div class="mark">SC</div>OpenAI Student Collective | SNU</div>
    <h1>아이디어를 만들고,<br>친구에게 공유하고,<br><em>사람들 앞에서 소개하기.</em></h1>
    <div class="steps"><span>Workshop 4회</span><span class="studio">Studio Session</span><span>Showcase</span></div>
  </div>
</body>
</html>
